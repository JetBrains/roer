# Roer's tmux substrate — an invisible session host, not a multiplexer UI.
#
# Loaded only for the private "roer" socket, so nothing here touches the
# user's own tmux server or their ~/.tmux.conf.

# No chrome and no prefix key: a roer session should be indistinguishable
# from a plain terminal.
set -g status off
set -g prefix None

# The two escape hatches. Without them the only way out of a session is a
# shell prompt inside it, which you do not have while an agent, an editor or
# a dev server owns the foreground — the prefix being unbound leaves no key to
# fall back on. Single chords in the root table (-n), so nothing modal comes
# back: M-d releases the session, M-h sends it to the app.
#
# -b matters: run-shell without it blocks the whole server until the command
# returns, and a handoff waits up to 10s for the app to confirm — which it
# cannot do, because its attach needs the server that is busy waiting.
#
# The shim is addressed through the directory of this file rather than PATH: a
# server started by the app inherits Finder's PATH, which has no ~/.local/bin.
# One -f is the shim's only way of loading this config, so #{config_files} is
# a single path here, never a list.
#
# The pane is passed in because run-shell sets no TMUX_PANE, and its working
# directory is the server's, not the pane's.
bind -n M-d detach-client
bind -n M-h run-shell -b '"$(dirname "#{config_files}")/roer" handoff --pane #{pane_id}'

# Colour and escape-sequence fidelity. Without the RGB feature override,
# agent TUIs degrade to a 256-colour approximation; without
# allow-passthrough, OSC 52 clipboard writes and DCS sequences are
# swallowed by tmux instead of reaching the outer terminal.
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set -g allow-passthrough on

# tmux waits escape-time ms to decide whether ESC starts a sequence, which
# reads as input lag in ESC-heavy TUIs.
set -g escape-time 0

set -g focus-events on
set -g mouse on
set -g history-limit 100000

# The session must outlive every client — that is the whole point of the
# handoff. Sizing follows the most recent client rather than the smallest,
# so a reattach into a differently-sized window reflows to fit it.
set -g destroy-unattached off
set -g window-size latest
setw -g aggressive-resize on
