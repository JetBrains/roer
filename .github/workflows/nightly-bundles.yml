name: Nightly bundles

# Packaging is slow — a Linux debug build plus deb, rpm and AppImage is a
# quarter of an hour, Windows' nsis and msi about as long — and only matters
# for a release, so it runs here rather than on every pull request. Nightly
# catches a packaging break within a day of the commit that caused it;
# dispatch runs it on demand, e.g. before tagging, or on a branch that touches
# tauri.*.conf.json.

on:
  schedule:
    # 03:17 UTC: off the top of the hour, when scheduled runs queue longest.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-bundles-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-bundle:
    name: Linux bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # As in CI's Checks, plus `file`, which the AppImage tooling shells out to.
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev file

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: linux-bundle

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Debug, like `npm run assemble`: this proves tauri.linux.conf.json
      # packages, and gives a build to try, without a release-profile compile
      # on every pull request.
      - name: Bundle
        run: npx tauri build --debug --bundles deb,rpm,appimage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roer-linux
          path: |
            src-tauri/target/debug/bundle/deb/*.deb
            src-tauri/target/debug/bundle/rpm/*.rpm
            src-tauri/target/debug/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows-bundle:
    name: Windows bundles
    runs-on: windows-latest
    # Allowed to fail, like the Windows checks in CI: Windows is a preview, so
    # a broken installer blocks nothing.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri -> target
            cli -> target
          key: windows-bundle

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The installers carry roer and psmux beside the app, as a release's do.
      - name: Stage the roer command
        run: bash .github/windows/prepare-installer.sh

      # Debug, as for Linux: proves the Windows config packages, and gives an
      # installer to try.
      - name: Bundle
        run: npx tauri build --debug --bundles nsis,msi --config src-tauri/tauri.windows-cli.conf.json

      # The one part of the installer nothing else runs: its PATH hook. Into a
      # folder with an apostrophe in it, since that is what a quoting mistake
      # in the hook would trip on.
      - name: Install, check PATH, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem src-tauri/target/debug/bundle/nsis/*-setup.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "O'Brien Roer"
          Start-Process $setup.FullName -ArgumentList '/S', "/D=$dir" -Wait
          $cli = Join-Path $dir 'roer'
          $path = [Environment]::GetEnvironmentVariable('Path', 'User') -split ';'
          if ($path -notcontains $cli) { throw "installer did not put $cli on the user PATH: $($path -join ';')" }
          & (Join-Path $cli 'roer.exe') help | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "roer help failed from $cli" }
          Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '/S' -Wait
          Start-Sleep 5
          $path = [Environment]::GetEnvironmentVariable('Path', 'User') -split ';'
          if ($path -contains $cli) { throw "uninstaller left $cli on the user PATH" }
          "installed to $dir, PATH set and cleared"

      - name: The roer command as a zip
        run: bash .github/windows/package-cli.sh cli/target/release/roer.exe "$RUNNER_TEMP/psmux" roer-cli-windows-x64.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roer-windows
          path: |
            src-tauri/target/debug/bundle/nsis/*.exe
            src-tauri/target/debug/bundle/msi/*.msi
            roer-cli-windows-x64.zip
          if-no-files-found: error
