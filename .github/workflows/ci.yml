name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly on main, for the Windows E2E that pull requests skip: the runner
  # image and its WebView2 move on their own, and a quiet main would never
  # notice. Only that job runs, and there it fails the run rather than being
  # reported, so a broken night mails whoever maintains the schedule. 03:47
  # UTC, clear of Nightly bundles' 03:17.
  schedule:
    - cron: "47 3 * * *"

concurrency:
  # event_name is in the key so a push to main cannot cancel a dispatched run
  # of the same ref.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'schedule'
    name: Checks (${{ matrix.os }})
    strategy:
      # One platform failing says nothing about the others; let all finish.
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows builds and opens but runs no sessions yet (there is no tmux),
    # and this suite has never passed there: report it without gating on it
    # until it does.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    defaults:
      run:
        # The steps below are POSIX shell; on Windows that is Git's bash.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What Tauri links against on Linux: WebKitGTK for the webview, and the
      # rest of its GTK stack. macOS has all of it in the system. tmux is for
      # the CLI tests, which drive a real server.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev tmux

      - name: tmux, for the CLI tests
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # No Cargo.toml at the repo root, so the action's default `. -> target`
          # finds no workspace and caches nothing.
          workspaces: |
            src-tauri -> target
            cli -> target
          # Distinct from the release key: this job builds the `test` profile,
          # release builds `release`. Sharing one key makes them evict each other.
          key: checks

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The order below is load-bearing. See README "Checks".

      # Cheapest, and first: version drift is caught on the PR rather than by a
      # release that fails after a full universal build.
      - name: Version records agree
        run: sh scripts/check-version

      - run: npm ci

      - name: Frontend tests
        run: npm test

      # MUST precede cargo test: dist/ is gitignored, and
      # tauri::generate_context!() embeds frontendDist (../dist) at compile
      # time, so on a clean checkout the Rust build fails without it.
      - name: Frontend build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features server-bin

      # The `roer` command, against a real tmux on a socket of its own. On
      # Windows only the unit tests exist: there is no tmux to drive.
      - name: CLI tests
        run: cargo test --manifest-path cli/Cargo.toml

      # The release guard is shell with no compiler behind it.
      - name: Shell syntax
        run: sh -n scripts/check-version

  # roer on native Windows: its session engine there is psmux, a tmux
  # reimplementation on ConPTY, and this drives the real roer.exe against it
  # the way the app and a terminal do. The Unix counterpart is the CLI tests
  # in Checks.
  windows-cli:
    if: github.event_name != 'schedule'
    name: Windows CLI on psmux
    runs-on: windows-latest
    # Reported, not gating, like the Windows checks: Windows is a preview.
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli -> target
          key: windows-cli

      # psmux beside roer.exe, as the Windows CLI ships them.
      - name: Build roer and fetch psmux
        run: |
          cargo build --locked --manifest-path cli/Cargo.toml
          bash .github/windows/fetch-psmux.sh cli/target/debug

      - name: Smoke-test roer on psmux
        run: bash .github/windows/smoke.sh cli/target/debug

  # The app itself, driven over WebDriver the way a person uses it, with a
  # fake `claude` in place of the agent: see e2e/README.md. tauri-driver has
  # no macOS backend, so Linux and Windows only.
  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows only off pull requests: on main, nightly (alone) and when
        # dispatched. It is the slow half, its minutes count double, and it
        # gates nothing but the nightly run.
        #
        # Not windows-latest: on its Server 2025 image msedgedriver never gets
        # a DevTools port from WebView2 ("DevToolsActivePort file doesn't
        # exist"), for other Tauri apps too, while 2022 works:
        # https://github.com/actions/runner-images/issues/14738
        os: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]'
          || github.event_name == 'schedule' && '["windows-2022"]'
          || '["ubuntu-latest", "windows-2022"]') }}
    runs-on: ${{ matrix.os }}
    # Builds take ~15 minutes cold and the tests under one: anything longer is
    # a hang, which would otherwise hold a runner for six hours.
    timeout-minutes: 40
    # Reported, not gating, like the other Windows jobs; except nightly, which
    # runs for this alone.
    continue-on-error: ${{ startsWith(matrix.os, 'windows') && github.event_name != 'schedule' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As in Checks, plus the WebDriver for WebKitGTK, a display for it, and
      # ffmpeg to record that display.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev tmux webkit2gtk-driver xvfb ffmpeg

      - name: ffmpeg, to record the run
        if: runner.os == 'Windows'
        run: command -v ffmpeg || choco install ffmpeg -y --no-progress

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            src-tauri -> target
            cli -> target
          # A debug app build, which neither Checks nor the bundles make.
          key: e2e

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      # Pinned: the WebDriver server between the tests and the app. Kept in
      # ~/.cargo/bin, which rust-cache restores, so it builds once.
      - name: tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked

      - run: npm ci

      - name: Build the app and roer
        run: |
          npx tauri build --debug --no-bundle
          cargo build --locked --manifest-path cli/Cargo.toml

      # The fake agent's claude.exe: see e2e/fake-agent/src/main.rs.
      - name: psmux beside roer, and the fake claude.exe
        if: runner.os == 'Windows'
        run: |
          bash .github/windows/fetch-psmux.sh cli/target/debug
          cargo build --locked --manifest-path e2e/fake-agent/Cargo.toml

      # A pane's PATH on Windows is the registry's, not the app's: psmux
      # builds each pane's environment afresh. So the fake claude.exe goes
      # into a folder on the user PATH, which is what installers do.
      - name: A folder on the user PATH for the fake claude.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'e2e-bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          $path = [Environment]::GetEnvironmentVariable('Path', 'User')
          [Environment]::SetEnvironmentVariable('Path', "$bin;$path", 'User')
          "ROER_E2E_BIN=$bin" >> $env:GITHUB_ENV

      # msedgedriver of WebView2's own version: the image's follows Edge,
      # which on 2022 is well ahead of the WebView2 runtime. Microsoft
      # publishes no checksums for these, so the version is the pin.
      - name: Edge driver for this WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          "WebView2 $version"
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          $zip = Join-Path $env:RUNNER_TEMP 'edgedriver.zip'
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $driver = Join-Path $dir 'msedgedriver.exe'
          & $driver --version
          "ROER_E2E_EDGEDRIVER=$driver" >> $env:GITHUB_ENV

      # Recorded, in slow motion and captioned with each test's name, so a
      # run can be watched step by step from its artifact.
      - name: E2E tests
        working-directory: e2e
        env:
          ROER_E2E_RECORD: ${{ github.workspace }}/e2e/artifacts/e2e-${{ runner.os }}.mp4
          ROER_E2E_PAUSE: 800
        run: |
          npm ci
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" npm test
          else
            npm test
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-${{ runner.os }}
          path: e2e/artifacts
          if-no-files-found: ignore
          retention-days: 7

  workflows:
    if: github.event_name != 'schedule'
    name: Workflows
    runs-on: ubuntu-latest
    env:
      # Pinned by version and checksum, like the CodeSign client in
      # release.yml. A linter that moves on its own turns a branch red for
      # reasons no commit explains, and `latest` would do exactly that.
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256_AMD64: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ACTIONLINT_SHA256_ARM64: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          # Resolved from uname rather than assumed: ubuntu-latest is x64
          # today, and this should not break the day that changes.
          case "$(uname -m)" in
            x86_64) ARCH=amd64; SHA="$ACTIONLINT_SHA256_AMD64" ;;
            aarch64|arm64) ARCH=arm64; SHA="$ACTIONLINT_SHA256_ARM64" ;;
            *) echo "No actionlint build pinned for $(uname -m)" >&2; exit 1 ;;
          esac
          TARBALL="actionlint_${ACTIONLINT_VERSION}_linux_${ARCH}.tar.gz"
          curl -fsSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${TARBALL}" \
            -o "$TARBALL"
          echo "${SHA}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" actionlint
          ./actionlint --version

      # Catches what nothing else here does: unknown keys, bad `needs`
      # references, undefined contexts, unpinned or misspelled actions. The
      # runner ships shellcheck, so actionlint checks every `run:` block too —
      # which is the only automated review the shell in these workflows gets.
      #
      # It cannot catch skip propagation through `needs`, the bug that made two
      # tagged runs publish nothing. Do not read a green lint as a working
      # pipeline.
      - name: Lint the workflows
        run: ./actionlint -color .github/workflows/*.yml

  check:
    name: Full gate
    needs: [checks, windows-cli, e2e, workflows]
    # Not nightly: that runs E2E alone, and a failure there fails the run.
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # The single required status check. It exists as an aggregate so a
      # cancelled or skipped dependency cannot leave the gate green.
      - name: All jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
