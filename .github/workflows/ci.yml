name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # event_name is in the key so a push to main cannot cancel a dispatched run
  # of the same ref.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # No Cargo.toml at the repo root, so the action's default `. -> target`
          # finds no workspace and caches nothing.
          workspaces: src-tauri -> target
          # Distinct from the release key: this job builds the `test` profile,
          # release builds `release`. Sharing one key makes them evict each other.
          key: checks

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The order below is load-bearing. See README "Checks".

      # Cheapest, and first: version drift is caught on the PR rather than by a
      # release that fails after a full universal build.
      - name: Version records agree
        run: sh scripts/check-version

      - run: npm ci

      - name: Frontend tests
        run: npm test

      # MUST precede cargo test: dist/ is gitignored, and
      # tauri::generate_context!() embeds frontendDist (../dist) at compile
      # time, so on a clean checkout the Rust build fails without it.
      - name: Frontend build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The shim is a shipped artifact with no compiler behind it.
      - name: Shell syntax
        run: sh -n scripts/roer && sh -n scripts/check-version

  check:
    name: Full gate
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # The single required status check. It exists as an aggregate so a
      # cancelled or skipped dependency cannot leave the gate green.
      - name: All jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
