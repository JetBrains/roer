name: psmux spike

# Spike: can roer run on native Windows with psmux, a tmux reimplementation on
# ConPTY, as its engine? Runs on pushes to the spike branch only; it goes away
# or becomes part of CI once the answer is known.

on:
  push:
    branches: [psmux-spike]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: psmux probe
    runs-on: windows-latest
    env:
      # Pinned by version and checksum, like actionlint in ci.yml.
      PSMUX_VERSION: 3.3.8
      PSMUX_SHA256: 1ad127ba937194a890b933a73d9b023e297bd73dc742abd841bf159984c2effe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install psmux
        run: |
          set -euo pipefail
          ZIP="psmux-v${PSMUX_VERSION}-windows-x64.zip"
          curl -fsSL --retry 3 -o "$ZIP" \
            "https://github.com/psmux/psmux/releases/download/v${PSMUX_VERSION}/${ZIP}"
          echo "${PSMUX_SHA256}  ${ZIP}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/psmux"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/psmux"
          echo "$RUNNER_TEMP/psmux" >> "$GITHUB_PATH"

      - name: Probe the tmux commands roer uses
        run: bash .github/psmux/probe.sh
