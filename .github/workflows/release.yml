name: Release

#   validate-version  ubuntu-latest   tag agrees with the version records
#   bundle-macos      macos-26        universal Roer.app.tar.gz, roer and tmux inside
#   bundle-linux      ubuntu-22.04    .deb, .rpm and AppImage, roer inside
#   verify-linux      ubuntu-latest   install the .deb, roer on PATH, remove it
#   cli-linux         ubuntu-latest   the roer command for Linux, alone
#   bundle-windows    windows-latest  unsigned nsis and msi installers
#   cli-windows       windows-latest  roer.exe with the psmux it drives
#   package           macos-26        verify, hdiutil .dmg, plugin zip, checksums
#   publish           ubuntu-latest   draft release
#
# Every job runs on a GitHub-hosted runner, and has to: the repository is
# public, and the internal runners (the ones that can reach the CodeSign
# service) serve only internal and private repositories, because a flaw in a
# public workflow would hand an attacker a foothold in the internal network.
# So the .app ships unsigned from here; Developer ID signing belongs to a
# pipeline outside this repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release in flight; a half-published release is worse than a
  # queued one.
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Needed for the ancestry check below; also gives us origin/main.
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "Release tag must point to a commit contained in main" >&2
              exit 1
            }
            sh scripts/check-version "$GITHUB_REF_NAME"
          else
            # A dispatch run builds, signs and packages but cannot publish:
            # `publish` is gated on the ref being a v* tag. So it is always a
            # dry run and is allowed from any branch. If publishing is ever
            # added to this path, restrict it to main here.
            echo "Dispatch run on $GITHUB_REF — dry run, nothing will be published."
            sh scripts/check-version
          fi

      - name: Export version
        id: version
        run: echo "version=$(sh scripts/check-version --print)" >> "$GITHUB_OUTPUT"

  bundle-macos:
    name: Bundle
    needs: validate-version
    uses: ./.github/workflows/tauri-bundle.yml
    with:
      runner: macos-26
      # Cross-compiles x86_64 from the arm64 runner, so the Intel runner sunset
      # (macos-15-intel / macos-26-intel die with macOS 15 in Fall 2027) is a
      # non-event and users get one download instead of a choice.
      rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
      # The app carries the roer command and the tmux it drives, and links
      # roer onto PATH itself, so the .dmg is the whole install: see
      # tauri.macos-cli.conf.json.
      prepare_script: .github/macos/prepare-bundle.sh
      tauri_args: --target universal-apple-darwin --bundles app --config src-tauri/tauri.macos-cli.conf.json
      bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
      artifact_name: unsigned-macos
      cache_key: macos-universal
      artifact_paths: Roer.app.tar.gz
      # Deliberately no release_environment: this job consumes no secrets, so
      # gating it on `release` would only stop it running from a branch. Only
      # `publish` touches credentials.

  # The packages carry roer beside the app, and the .deb and .rpm link it as
  # /usr/bin/roer, so installing one is the whole install: see
  # tauri.linux-cli.conf.json. Built on the oldest supported Ubuntu, so the
  # binaries ask for no newer glibc than it has, and run on newer ones.
  bundle-linux:
    name: Bundle (Linux)
    needs: validate-version
    uses: ./.github/workflows/tauri-bundle.yml
    with:
      runner: ubuntu-22.04
      rust_targets: x86_64-unknown-linux-gnu
      prepare_script: .github/linux/prepare-bundle.sh
      tauri_args: --bundles deb,rpm,appimage --config src-tauri/tauri.linux-cli.conf.json
      bundle_dir: src-tauri/target/release/bundle
      artifact_name: linux-packages
      cache_key: linux
      artifact_paths: |
        src-tauri/target/release/bundle/deb/*.deb
        src-tauri/target/release/bundle/rpm/*.rpm
        src-tauri/target/release/bundle/appimage/*.AppImage

  # As a person would: the .deb installed with its dependencies, roer on PATH
  # finding its config, and both gone again with the package. The .rpm and the
  # AppImage are checked for the same files, since this runner can neither
  # install the one nor mount the other.
  verify-linux:
    name: Verify (Linux)
    needs: [validate-version, bundle-linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: linux

      - name: Install and remove the .deb
        run: |
          set -euo pipefail
          # roer needs tmux 3.3 or later, so on an older one the install has to
          # refuse rather than leave a Roer that cannot start a session.
          dpkg-deb -f "linux/Roer_${VERSION}_amd64.deb" Depends | tee /dev/stderr | grep -qF 'tmux (>= 3.3)'
          sudo apt-get update
          sudo apt-get install -y "./linux/Roer_${VERSION}_amd64.deb"
          ls -l /usr/bin/roer /usr/bin/roer-app /usr/lib/Roer/cli
          [ "$(readlink /usr/bin/roer)" = /usr/lib/Roer/cli/roer ]
          test -x /usr/lib/Roer/cli/roer
          test -f /usr/lib/Roer/cli/skills/roer-handoff/SKILL.md
          command -v tmux
          # From /usr/bin, as a new terminal finds it: through the link to its
          # config, with no checkout to fall back on.
          (cd / && roer help > /dev/null)
          sudo apt-get remove -y roer
          if [ -e /usr/bin/roer ] || [ -L /usr/bin/roer ]; then
            echo "/usr/bin/roer is left behind after removing the package" >&2
            exit 1
          fi

      - name: The .rpm and the AppImage carry roer
        run: |
          set -euo pipefail
          sudo apt-get install -y rpm
          rpm=$(rpm -qlp "linux/Roer-${VERSION}-1.x86_64.rpm")
          printf '%s\n' "$rpm"
          for f in /usr/bin/roer-app /usr/lib/Roer/cli/roer /usr/lib/Roer/cli/roer-tmux.conf \
                   /usr/lib/Roer/cli/skills/roer-handoff/SKILL.md; do
            grep -qx "$f" <<< "$rpm" || { echo "The .rpm has no $f" >&2; exit 1; }
          done
          # post-install.sh and post-remove.sh, which link and unlink /usr/bin/roer.
          rpm -qpR "linux/Roer-${VERSION}-1.x86_64.rpm" | tee /dev/stderr | grep -qx 'tmux >= 3.3'
          scripts=$(rpm -qp --scripts "linux/Roer-${VERSION}-1.x86_64.rpm")
          printf '%s\n' "$scripts"
          grep -q 'cli=/usr/lib/Roer/cli/roer' <<< "$scripts"
          grep -q 'readlink /usr/bin/roer' <<< "$scripts"
          appimage="linux/Roer_${VERSION}_amd64.AppImage"
          chmod +x "$appimage"
          (cd linux && "./$(basename "$appimage")" --appimage-extract > /dev/null)
          test -x linux/squashfs-root/usr/lib/Roer/cli/roer
          (cd / && "$GITHUB_WORKSPACE/linux/squashfs-root/usr/lib/Roer/cli/roer" help > /dev/null)

  # The roer command on Linux, for anyone who wants it without the app. It is
  # a small crate with no Tauri in it, so this is a minute of cargo rather
  # than a bundle; the packages carry the same, built by bundle-linux's
  # prepare script.
  cli-linux:
    name: CLI (Linux)
    needs: validate-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli -> target
          key: cli-linux

      - name: Build and stage
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path cli/Cargo.toml
          mkdir -p shim dist
          install -m 755 cli/target/release/roer shim/roer
          install -m 644 scripts/roer-tmux.conf shim/roer-tmux.conf
          cp -R .claude/skills shim/skills
          # A release build has no checkout to fall back on, so this proves it
          # finds the config beside itself, as it will once installed.
          shim/roer help > /dev/null
          tar -czf "dist/roer-cli-${VERSION}-linux-x86_64.tar.gz" -C shim roer roer-tmux.conf skills
          tar -tvzf "dist/roer-cli-${VERSION}-linux-x86_64.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-linux
          path: dist/*.tar.gz
          compression-level: 0
          if-no-files-found: error

  # Windows is a preview: unsigned, so SmartScreen warns on install, and it
  # runs sessions on psmux rather than tmux.
  bundle-windows:
    name: Bundle (Windows)
    needs: validate-version
    uses: ./.github/workflows/tauri-bundle.yml
    with:
      runner: windows-latest
      rust_targets: x86_64-pc-windows-msvc
      # The installers carry roer and psmux beside the app, and the .exe one
      # puts them on the user's PATH: see tauri.windows-cli.conf.json.
      prepare_script: .github/windows/prepare-installer.sh
      tauri_args: --bundles nsis,msi --config src-tauri/tauri.windows-cli.conf.json
      bundle_dir: src-tauri/target/release/bundle
      artifact_name: unsigned-windows
      cache_key: windows
      artifact_paths: |
        src-tauri/target/release/bundle/nsis/*.exe
        src-tauri/target/release/bundle/msi/*.msi

  # The same roer and psmux as the installers carry, as a zip, for anyone who
  # wants the command without the app, the way the Linux CLI ships as a
  # tarball.
  cli-windows:
    name: CLI (Windows)
    needs: validate-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli -> target
          key: cli-windows

      - name: Build and package
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path cli/Cargo.toml
          bash .github/windows/fetch-psmux.sh "$RUNNER_TEMP/psmux"
          mkdir -p dist
          bash .github/windows/package-cli.sh cli/target/release/roer.exe "$RUNNER_TEMP/psmux" \
            "dist/roer-cli-${VERSION}-windows-x64.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-windows
          path: dist/*.zip
          compression-level: 0
          if-no-files-found: error

  package:
    name: Package
    needs: [validate-version, bundle-macos, bundle-linux, verify-linux, cli-linux, bundle-windows, cli-windows]
    runs-on: macos-26
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-macos
          path: incoming

      - name: Unpack the app bundle
        run: |
          set -euo pipefail
          mkdir -p work
          tar -C work -xzf incoming/Roer.app.tar.gz
          test -d work/Roer.app

      - name: Verify the binary
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/work/Roer.app"
          for bin in roer-app roer tmux; do
            ARCHS="$(lipo -archs "$APP/Contents/MacOS/$bin")"
            echo "$bin archs: $ARCHS"
            for want in x86_64 arm64; do
              grep -qw "$want" <<< "$ARCHS" || {
                echo "Universal binary $bin is missing $want" >&2
                exit 1
              }
            done
          done
          # The roer that the app links onto PATH has to find its config in
          # Resources and its tmux beside it, with no checkout and no Homebrew
          # to fall back on. `roer help` fails without the config.
          test -f "$APP/Contents/Resources/roer-tmux.conf"
          test -f "$APP/Contents/Resources/skills/roer-handoff/SKILL.md"
          "$APP/Contents/MacOS/roer" help > /dev/null
          "$APP/Contents/MacOS/tmux" -V
          MIN="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")"
          echo "minimum system version: $MIN"
          [ "$MIN" = "15.0" ] || {
            echo "Expected LSMinimumSystemVersion 15.0, got $MIN — tauri.conf.json and the README disagree" >&2
            exit 1
          }

      - name: Build the .dmg
        run: |
          set -euo pipefail
          mkdir -p stage dist
          # ditto, never cp: it preserves the extended attributes and symlinks
          # the signature envelope depends on.
          ditto "work/Roer.app" "stage/Roer.app"
          # Gives the normal drag-to-install window.
          ln -s /Applications stage/Applications
          # Replaces Tauri's bundle_dmg.sh, which drives AppleScript and fails
          # intermittently on CI. hdiutil is deterministic.
          hdiutil create -volname Roer -srcfolder stage -ov -format UDZO \
            "dist/Roer_${VERSION}_universal.dmg"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-linux
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-windows
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-windows
          path: dist

      # Tauri names the installers and packages itself; the release lists
      # them by name, so a rename upstream fails here rather than as a missing
      # asset.
      - name: Check the installers and packages
        run: |
          set -euo pipefail
          ls -l "dist/Roer_${VERSION}_x64-setup.exe" "dist/Roer_${VERSION}_x64_en-US.msi" \
                "dist/Roer_${VERSION}_amd64.deb" "dist/Roer-${VERSION}-1.x86_64.rpm" \
                "dist/Roer_${VERSION}_amd64.AppImage"

      # The roer-ui Claude Code plugin, as its folder: the person unzips it
      # and points `claude --plugin-dir` at it. git archive takes the tracked
      # files only, so nothing /plugin-types or the engine wrote gets in.
      - name: Zip the Claude Code plugin
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=roer-ui/ \
            -o "dist/roer-ui-claude-plugin-${VERSION}.zip" HEAD:claude-plugin/roer-ui
          unzip -l "dist/roer-ui-claude-plugin-${VERSION}.zip"
          unzip -l "dist/roer-ui-claude-plugin-${VERSION}.zip" | grep -q ' roer-ui/.claude-plugin/plugin.json$'

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          shasum -a 256 -- *.dmg *.deb *.rpm *.AppImage *.tar.gz *.exe *.msi *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          set -euo pipefail
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__TAG__|${GITHUB_REF_NAME}|g" \
              .github/release-notes.md > dist/notes.md
          cat dist/notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish
    needs: [validate-version, package]
    # The tag check keeps a workflow_dispatch run from publishing: a dispatch
    # exercises the whole pipeline — build, cache, tarball, hdiutil, CLI,
    # checksums — and creates no release and no tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # This job deliberately has no checkout — it only needs the artifacts —
      # so `gh` has no git remote to infer the repository from and
      # `gh release create` dies with "not a git repository". The `gh api` call
      # below happens to work because its path is explicit; anything using the
      # repo shorthand needs this.
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      # Not `gh release create --generate-notes`: that flag generates the title
      # *and* body, so it would compete with --title and --notes-file for the
      # same fields and could drop the install instructions. Calling the API
      # and concatenating is unambiguous.
      - name: Append the generated changelog
        working-directory: dist
        run: |
          set -euo pipefail
          # Best-effort on purpose. The changelog is a convenience; the install
          # instructions in notes.md are the part users cannot do without. A
          # failure here must not be the reason a built, verified .dmg goes
          # unreleased — so this is a warning, not an error.
          if CHANGELOG="$(gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                -f tag_name="$GITHUB_REF_NAME" \
                --jq '.body')" && [ -n "$CHANGELOG" ]; then
            {
              printf '\n---\n\n'
              printf '%s\n' "$CHANGELOG"
            } >> notes.md
          else
            echo "::warning::Could not generate a changelog for $GITHUB_REF_NAME; publishing the install notes alone."
          fi
          cat notes.md

      - name: Create the draft release
        working-directory: dist
        run: |
          set -euo pipefail
          # Draft on purpose: a human confirms the app opens and that M-h hands
          # a session over before this is visible to anyone.
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Roer $VERSION" \
            --notes-file notes.md \
            "Roer_${VERSION}_universal.dmg" \
            "Roer_${VERSION}_amd64.deb" \
            "Roer-${VERSION}-1.x86_64.rpm" \
            "Roer_${VERSION}_amd64.AppImage" \
            "roer-cli-${VERSION}-linux-x86_64.tar.gz" \
            "Roer_${VERSION}_x64-setup.exe" \
            "Roer_${VERSION}_x64_en-US.msi" \
            "roer-cli-${VERSION}-windows-x64.zip" \
            "roer-ui-claude-plugin-${VERSION}.zip" \
            SHA256SUMS.txt
          echo "Draft release created. Review, smoke-test, then publish it."

  release-gate:
    name: Release gate
    needs: [publish]
    # Deliberately keyed off event_name, not the ref: `publish` gates on
    # startsWith(github.ref, ...), and using the same mechanism twice would let
    # a single bad expression skip the check along with the job it checks. The
    # only `push` trigger this workflow has is on v* tags.
    #
    # `always()` is what lets this job observe a skipped `publish` at all — a
    # plain `if:` would inherit the very skip it exists to report, which is the
    # failure this gate caught on the second v0.1.0 run.
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: A pushed tag must produce a release
        env:
          RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          [ "$RESULT" = "success" ] || {
            echo "Tag $GITHUB_REF_NAME was pushed but Publish did not succeed (result: $RESULT)." >&2
            echo "Without this gate the run reports success while publishing nothing." >&2
            exit 1
          }
          echo "Publish succeeded for $GITHUB_REF_NAME."
