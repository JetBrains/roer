name: Release

# Signing has to happen *between* bundling the .app and imaging the .dmg, and
# the CodeSign service lives on an internal host unreachable from
# GitHub-hosted runners. Hence the three-runner shuttle:
#
#   validate-version  ubuntu-latest   tag agrees with the version records
#   bundle-macos      macos-26        universal Roer.app.tar.gz, roer and tmux inside
#   codesign          sre-eqx-kata    Developer ID + hardened runtime
#   cli-linux         ubuntu-latest   the roer command for Linux
#   bundle-windows    windows-latest  unsigned nsis and msi installers
#   cli-windows       windows-latest  roer.exe with the psmux it drives
#   package           macos-26        verify, hdiutil .dmg, checksums
#   publish           ubuntu-latest   draft release
#
# Until the CodeSign service account lands, set no CODESIGN_ENABLED variable and
# the pipeline runs end to end unsigned.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release in flight; a half-published release is worse than a
  # queued one.
  cancel-in-progress: false

env:
  CODESIGN_BASE: https://codesign-distribution.labs.jb.gg

jobs:
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed for the ancestry check below; also gives us origin/main.
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "Release tag must point to a commit contained in main" >&2
              exit 1
            }
            sh scripts/check-version "$GITHUB_REF_NAME"
          else
            # A dispatch run builds, signs and packages but cannot publish:
            # `publish` is gated on the ref being a v* tag. So it is always a
            # dry run and is allowed from any branch. If publishing is ever
            # added to this path, restrict it to main here.
            echo "Dispatch run on $GITHUB_REF — dry run, nothing will be published."
            sh scripts/check-version
          fi

      - name: Export version
        id: version
        run: echo "version=$(sh scripts/check-version --print)" >> "$GITHUB_OUTPUT"

  bundle-macos:
    name: Bundle
    needs: validate-version
    uses: ./.github/workflows/tauri-bundle.yml
    with:
      runner: macos-26
      # Cross-compiles x86_64 from the arm64 runner, so the Intel runner sunset
      # (macos-15-intel / macos-26-intel die with macOS 15 in Fall 2027) is a
      # non-event and users get one download instead of a choice.
      rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
      # The app carries the roer command and the tmux it drives, and links
      # roer onto PATH itself, so the .dmg is the whole install: see
      # tauri.macos-cli.conf.json.
      prepare_script: .github/macos/prepare-bundle.sh
      tauri_args: --target universal-apple-darwin --bundles app --config src-tauri/tauri.macos-cli.conf.json
      bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
      artifact_name: unsigned-macos
      cache_key: macos-universal
      artifact_paths: Roer.app.tar.gz
      # Deliberately no release_environment: this job consumes no secrets, so
      # gating it on `release` would only stop it running from a branch. Only
      # `codesign` and `publish` touch credentials.

  # The roer command on Linux. It is a small crate with no Tauri in it, so this
  # is a minute of cargo rather than a bundle; the macOS one ships inside
  # Roer.app, built by bundle-macos's prepare script.
  cli-linux:
    name: CLI (Linux)
    needs: validate-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli -> target
          key: cli-linux

      - name: Build and stage
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path cli/Cargo.toml
          mkdir -p shim dist
          install -m 755 cli/target/release/roer shim/roer
          install -m 644 scripts/roer-tmux.conf shim/roer-tmux.conf
          cp -R .claude/skills shim/skills
          # A release build has no checkout to fall back on, so this proves it
          # finds the config beside itself, as it will once installed.
          shim/roer help > /dev/null
          tar -czf "dist/roer-cli-${VERSION}-linux-x86_64.tar.gz" -C shim roer roer-tmux.conf skills
          tar -tvzf "dist/roer-cli-${VERSION}-linux-x86_64.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-linux
          path: dist/*.tar.gz
          compression-level: 0
          if-no-files-found: error

  # Windows is a preview: unsigned, so SmartScreen warns on install, and it
  # runs sessions on psmux rather than tmux.
  bundle-windows:
    name: Bundle (Windows)
    needs: validate-version
    uses: ./.github/workflows/tauri-bundle.yml
    with:
      runner: windows-latest
      rust_targets: x86_64-pc-windows-msvc
      # The installers carry roer and psmux beside the app, and the .exe one
      # puts them on the user's PATH: see tauri.windows-cli.conf.json.
      prepare_script: .github/windows/prepare-installer.sh
      tauri_args: --bundles nsis,msi --config src-tauri/tauri.windows-cli.conf.json
      bundle_dir: src-tauri/target/release/bundle
      artifact_name: unsigned-windows
      cache_key: windows
      artifact_paths: |
        src-tauri/target/release/bundle/nsis/*.exe
        src-tauri/target/release/bundle/msi/*.msi

  # The same roer and psmux as the installers carry, as a zip, for anyone who
  # wants the command without the app, the way the Linux CLI ships as a
  # tarball.
  cli-windows:
    name: CLI (Windows)
    needs: validate-version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli -> target
          key: cli-windows

      - name: Build and package
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path cli/Cargo.toml
          bash .github/windows/fetch-psmux.sh "$RUNNER_TEMP/psmux"
          mkdir -p dist
          bash .github/windows/package-cli.sh cli/target/release/roer.exe "$RUNNER_TEMP/psmux" \
            "dist/roer-cli-${VERSION}-windows-x64.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-windows
          path: dist/*.zip
          compression-level: 0
          if-no-files-found: error

  codesign:
    name: CodeSign
    needs: bundle-macos
    # Repo-level variable, not an environment one: environment variables are not
    # readable in a job-level `if`. Unset until the service account is issued.
    if: vars.CODESIGN_ENABLED == 'true'
    runs-on: sre-eqx-kata
    environment: release
    env:
      # The client reads these implicitly; there is no CLI flag for them.
      SERVICE_ACCOUNT_NAME: ${{ secrets.SERVICE_ACCOUNT_NAME }}
      SERVICE_ACCOUNT_TOKEN: ${{ secrets.SERVICE_ACCOUNT_TOKEN }}
    steps:
      - name: Install CodeSign client
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) A=amd64 ;;
            aarch64|arm64) A=arm64 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          BIN="codesign-client-linux-$A"
          curl -fsSL "$CODESIGN_BASE/$BIN" -o "$BIN"
          curl -fsSL "$CODESIGN_BASE/$BIN.sha256" -o "$BIN.sha256"
          curl -fsSL "$CODESIGN_BASE/$BIN.sha256.asc" -o "$BIN.sha256.asc"
          # Verify the signature over the checksum file *before* trusting the
          # checksum. Checking sha256 alone would only prove the binary matches
          # a file from the same host that served it.
          curl -fsSL https://download-cdn.jetbrains.com/KEYS | gpg --batch --dearmor --output keyring.gpg
          gpgv --keyring ./keyring.gpg "$BIN.sha256.asc" "$BIN.sha256"
          sha256sum -c "$BIN.sha256"
          mv "$BIN" codesign-client
          chmod +x codesign-client

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-macos
          path: mac

      - name: Sign (Developer ID + hardened runtime)
        run: |
          set -euo pipefail
          mkdir -p signed-mac
          # No mac_codesign_entitlements: roer needs no entitlements. Hardened
          # runtime with no exceptions is correct here — no JIT, no unsigned
          # dylibs, and JS runs in Apple's separately signed WKWebView process.
          # Do not add allow-jit or disable-library-validation.
          ./codesign-client \
            -signed-files-dir signed-mac \
            -denoted-content-type "application/x-mac-app-targz" \
            -extensions "mac_codesign_force=true,mac_codesign_options=runtime" \
            -log-format json \
            mac/Roer.app.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-macos
          path: signed-mac/Roer.app.tar.gz
          compression-level: 0
          if-no-files-found: error

  package:
    name: Package
    needs: [validate-version, bundle-macos, codesign, cli-linux, bundle-windows, cli-windows]
    # codesign is skipped, not failed, when CODESIGN_ENABLED is unset — so this
    # job must run on 'skipped' but not on 'failure'. This `if` is the whole of
    # the "works before signing access lands" mechanism.
    if: |
      always()
      && needs.bundle-macos.result == 'success'
      && needs.cli-linux.result == 'success'
      && needs.bundle-windows.result == 'success'
      && needs.cli-windows.result == 'success'
      && needs.codesign.result != 'failure'
      && needs.codesign.result != 'cancelled'
    runs-on: macos-26
    env:
      VERSION: ${{ needs.validate-version.outputs.version }}
      SIGNED: ${{ needs.codesign.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.codesign.result == 'success' && 'signed-macos' || 'unsigned-macos' }}
          path: incoming

      - name: Unpack the app bundle
        run: |
          set -euo pipefail
          mkdir -p work
          tar -C work -xzf incoming/Roer.app.tar.gz
          test -d work/Roer.app

      - name: Verify the signature
        if: needs.codesign.result == 'success'
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/work/Roer.app"
          # Fail before packaging if CodeSign returned a bundle with an unstable
          # identity or unsealed resources.
          codesign --verify --deep --strict --verbose=2 "$APP"
          INFO="$(codesign -dvv "$APP" 2>&1)"
          REQ="$(codesign -d -r- "$APP" 2>&1)"
          grep -q '^Identifier=com.jetbrains.roer$' <<< "$INFO" || {
            echo "Signed app has the wrong bundle identity" >&2
            echo "$INFO" >&2
            exit 1
          }
          # An ad-hoc or content-bound (cdhash) designated requirement means
          # macOS would not remember the app's Keychain ACL across an update.
          if grep -q '^Signature=adhoc$' <<< "$INFO" || grep -q 'cdhash H' <<< "$REQ"; then
            echo "Signed app has an ad-hoc/content-bound identity; Keychain trust would not survive an update" >&2
            echo "$INFO" >&2
            echo "$REQ" >&2
            exit 1
          fi
          grep -q 'identifier "com.jetbrains.roer"' <<< "$REQ" || {
            echo "Signed app has an unexpected designated requirement" >&2
            echo "$REQ" >&2
            exit 1
          }
          # TODO: assert ^TeamIdentifier=<id>$ once SRE confirms which Developer
          # ID roer signs under. Without it, any valid Developer ID passes.
          # The roer command and tmux run on their own, from a terminal, so
          # each needs its own signature and hardened runtime, not only the
          # bundle's seal over them.
          for tool in roer tmux; do
            codesign --verify --strict --verbose=2 "$APP/Contents/MacOS/$tool"
            codesign -dvv "$APP/Contents/MacOS/$tool" 2>&1 | grep -q 'flags=.*(runtime)' || {
              echo "Contents/MacOS/$tool is not signed with the hardened runtime" >&2
              codesign -dvv "$APP/Contents/MacOS/$tool" >&2 || true
              exit 1
            }
          done
          ENT="$(codesign -d --entitlements :- "$APP" 2>&1 || true)"
          if grep -q '<key>' <<< "$ENT"; then
            echo "Unexpected entitlement in signed Roer.app" >&2
            echo "$ENT" >&2
            exit 1
          fi

      - name: Verify the binary
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/work/Roer.app"
          for bin in roer-app roer tmux; do
            ARCHS="$(lipo -archs "$APP/Contents/MacOS/$bin")"
            echo "$bin archs: $ARCHS"
            for want in x86_64 arm64; do
              grep -qw "$want" <<< "$ARCHS" || {
                echo "Universal binary $bin is missing $want" >&2
                exit 1
              }
            done
          done
          # The roer that the app links onto PATH has to find its config in
          # Resources and its tmux beside it, with no checkout and no Homebrew
          # to fall back on. `roer help` fails without the config.
          test -f "$APP/Contents/Resources/roer-tmux.conf"
          test -f "$APP/Contents/Resources/skills/roer-handoff/SKILL.md"
          "$APP/Contents/MacOS/roer" help > /dev/null
          "$APP/Contents/MacOS/tmux" -V
          MIN="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")"
          echo "minimum system version: $MIN"
          [ "$MIN" = "15.0" ] || {
            echo "Expected LSMinimumSystemVersion 15.0, got $MIN — tauri.conf.json and the README disagree" >&2
            exit 1
          }

      - name: Build the .dmg
        run: |
          set -euo pipefail
          mkdir -p stage dist
          # ditto, never cp: it preserves the extended attributes and symlinks
          # the signature envelope depends on.
          ditto "work/Roer.app" "stage/Roer.app"
          # Gives the normal drag-to-install window.
          ln -s /Applications stage/Applications
          # Replaces Tauri's bundle_dmg.sh, which drives AppleScript and fails
          # intermittently on CI. hdiutil is deterministic.
          hdiutil create -volname Roer -srcfolder stage -ov -format UDZO \
            "dist/Roer_${VERSION}_universal.dmg"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-linux
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-windows
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-windows
          path: dist

      # Tauri names the installers itself; the release lists them by name, so
      # a rename upstream fails here rather than as a missing asset.
      - name: Check the Windows installers
        run: |
          set -euo pipefail
          ls -l "dist/Roer_${VERSION}_x64-setup.exe" "dist/Roer_${VERSION}_x64_en-US.msi"

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          shasum -a 256 -- *.dmg *.tar.gz *.exe *.msi *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          set -euo pipefail
          SIGN_LINE="This build is **unsigned**."
          if [ "$SIGNED" = "true" ]; then
            SIGN_LINE="This build is signed with a JetBrains Developer ID, but is **not yet notarized**."
          fi
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__TAG__|${GITHUB_REF_NAME}|g" \
              -e "s|__SIGNING__|${SIGN_LINE}|g" \
              .github/release-notes.md > dist/notes.md
          cat dist/notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish
    needs: [validate-version, package]
    # `!cancelled()` is load-bearing, not defensive noise. A skip propagates
    # transitively through `needs`: this job needs `package`, which needs
    # `codesign`, which is skipped whenever CODESIGN_ENABLED is unset. A plain
    # `if:` does not clear that inherited skip, so the first two v0.1.0 runs
    # skipped this job and published nothing while `package` succeeded.
    # `package` survives the same chain only because its own `if` says
    # `always()`. Verified against a tag push: a publish-shaped job with a
    # plain `if:` skipped, the same job with `!cancelled()` ran.
    #
    # `!cancelled()` rather than `always()` so a cancelled run cannot publish,
    # and because it drops the implicit success() the ancestor results have to
    # be asserted explicitly below — without them a failed `package` would
    # publish a release with no assets.
    #
    # The tag check keeps a workflow_dispatch run from publishing: a dispatch
    # exercises the whole pipeline — build, cache, tarball, codesign skip,
    # hdiutil, CLI, checksums — and creates no release and no tag.
    if: |
      !cancelled()
      && needs.validate-version.result == 'success'
      && needs.package.result == 'success'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # This job deliberately has no checkout — it only needs the artifacts —
      # so `gh` has no git remote to infer the repository from and
      # `gh release create` dies with "not a git repository". The `gh api` call
      # below happens to work because its path is explicit; anything using the
      # repo shorthand needs this.
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist

      # Not `gh release create --generate-notes`: that flag generates the title
      # *and* body, so it would compete with --title and --notes-file for the
      # same fields and could drop the install instructions. Calling the API
      # and concatenating is unambiguous.
      - name: Append the generated changelog
        working-directory: dist
        run: |
          set -euo pipefail
          # Best-effort on purpose. The changelog is a convenience; the install
          # instructions in notes.md are the part users cannot do without. A
          # failure here must not be the reason a built, verified .dmg goes
          # unreleased — so this is a warning, not an error.
          if CHANGELOG="$(gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/releases/generate-notes" \
                -f tag_name="$GITHUB_REF_NAME" \
                --jq '.body')" && [ -n "$CHANGELOG" ]; then
            {
              printf '\n---\n\n'
              printf '%s\n' "$CHANGELOG"
            } >> notes.md
          else
            echo "::warning::Could not generate a changelog for $GITHUB_REF_NAME; publishing the install notes alone."
          fi
          cat notes.md

      - name: Create the draft release
        working-directory: dist
        run: |
          set -euo pipefail
          # Draft on purpose: a human confirms the app opens and that M-h hands
          # a session over before this is visible to anyone.
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Roer $VERSION" \
            --notes-file notes.md \
            "Roer_${VERSION}_universal.dmg" \
            "roer-cli-${VERSION}-linux-x86_64.tar.gz" \
            "Roer_${VERSION}_x64-setup.exe" \
            "Roer_${VERSION}_x64_en-US.msi" \
            "roer-cli-${VERSION}-windows-x64.zip" \
            SHA256SUMS.txt
          echo "Draft release created. Review, smoke-test, then publish it."

  release-gate:
    name: Release gate
    needs: [publish]
    # Deliberately keyed off event_name, not the ref: `publish` gates on
    # startsWith(github.ref, ...), and using the same mechanism twice would let
    # a single bad expression skip the check along with the job it checks. The
    # only `push` trigger this workflow has is on v* tags.
    #
    # `always()` is what lets this job observe a skipped `publish` at all — a
    # plain `if:` would inherit the very skip it exists to report, which is the
    # failure this gate caught on the second v0.1.0 run.
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: A pushed tag must produce a release
        env:
          RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          [ "$RESULT" = "success" ] || {
            echo "Tag $GITHUB_REF_NAME was pushed but Publish did not succeed (result: $RESULT)." >&2
            echo "Without this gate the run reports success while publishing nothing." >&2
            exit 1
          }
          echo "Publish succeeded for $GITHUB_REF_NAME."
