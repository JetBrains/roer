name: Windows update

# "Update and restart" on Windows: the updater's own download and checks on
# a real, signed release, then a new setup run as the updater runs it over
# an install that is running, with a psmux server out of its folder. Docker
# cannot do this, and the e2e update test covers Linux only.
#
# The setup run over the install is this branch's, built here, unless `to`
# names a release: on pull requests that touch the update path, and by hand
# before a release (From the oldest version people update from).
on:
  workflow_dispatch:
    inputs:
      from:
        description: Version installed and running (0.9.11 is the first that updates itself)
        default: 0.9.11
      to:
        description: Release updated to; this branch's setup, built here, when empty
        default: ""
  pull_request:
    paths:
      - .github/workflows/windows-update.yml
      - .github/windows/update-over-running.ps1
      - src-tauri/src/update_install.rs
      - src-tauri/src/updates.rs
      - src-tauri/windows/installer-hooks.nsh
      - src-tauri/tauri.windows-cli.conf.json

concurrency:
  group: windows-update-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  versions:
    name: Versions
    runs-on: ubuntu-latest
    outputs:
      from: ${{ steps.pick.outputs.from }}
      to: ${{ steps.pick.outputs.to }}
      build: ${{ steps.pick.outputs.build }}
      signed: ${{ steps.pick.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `to`: the version the setup run over the install says it is.
      # `signed`: the release whose setup the updater's checks run on, which
      # a setup built here, unsigned, cannot stand in for.
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ inputs.from || '0.9.11' }}
          TO: ${{ inputs.to }}
        run: |
          set -euo pipefail
          if [ -n "$TO" ]; then
            BUILD=false SIGNED=$TO
          else
            BUILD=true TO=$(jq -r .version src-tauri/tauri.conf.json)
            SIGNED=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName | ltrimstr("v")')
          fi
          echo "Roer $FROM -> $TO (built here: $BUILD); checks on $SIGNED"
          {
            echo "from=$FROM"
            echo "to=$TO"
            echo "build=$BUILD"
            echo "signed=$SIGNED"
          } >> "$GITHUB_OUTPUT"

  bundle:
    name: Setup from this branch
    needs: versions
    if: needs.versions.outputs.build == 'true'
    uses: ./.github/workflows/tauri-bundle.yml
    with:
      runner: windows-latest
      rust_targets: x86_64-pc-windows-msvc
      prepare_script: .github/windows/prepare-installer.sh
      tauri_args: --bundles nsis --config src-tauri/tauri.windows-cli.conf.json
      bundle_dir: src-tauri/target/release/bundle
      artifact_name: windows-update-setup
      # The release's own cache: the same build.
      cache_key: windows
      artifact_paths: src-tauri/target/release/bundle/nsis/*.exe
      retention_days: 1

  checks:
    name: Download and checks (${{ needs.versions.outputs.signed }})
    needs: versions
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: windows-update

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # tauri::generate_context!() embeds dist/ at compile time.
      - run: npm ci
      - run: npm run build

      - name: The updater's checks on the real setup
        env:
          ROER_UPDATE_CHECK_VERSION: ${{ needs.versions.outputs.signed }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -- --ignored --exact update_install::tests::checks_a_real_windows_setup

  over-running:
    name: Setup over a running ${{ needs.versions.outputs.from }}
    needs: [versions, bundle]
    # The bundle is skipped when `to` names a release.
    if: ${{ !cancelled() && needs.versions.result == 'success' && needs.bundle.result != 'failure' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.versions.outputs.build == 'true'
        with:
          name: windows-update-setup
          path: ${{ runner.temp }}/built

      - name: Update a running install
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ needs.versions.outputs.from }}
          TO: ${{ needs.versions.outputs.to }}
          BUILD: ${{ needs.versions.outputs.build }}
        run: |
          $built = if ($env:BUILD -eq 'true') { (Get-ChildItem "$env:RUNNER_TEMP\built\*-setup.exe").FullName } else { '' }
          .github/windows/update-over-running.ps1 -From $env:FROM -To $env:TO -Setup $built -Out "$env:RUNNER_TEMP\update-shots"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-update-screens
          path: ${{ runner.temp }}/update-shots
          if-no-files-found: ignore
