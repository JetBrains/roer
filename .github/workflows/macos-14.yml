name: macOS 14

# Whether Roer still runs on macOS 14, its floor. GitHub retired its macOS 14
# runners on 2026-11-02, so this can no longer run there. It bundles the app
# exactly as a release does, then checks the floor where it can be read: the
# app's LSMinimumSystemVersion and the macOS version roer-app and roer are
# built for must be 14.0 or lower (tmux, which macOS does not hold a
# command-line tool to, up to fetch-tmux.sh's TMUX_MAX_MINOS, shown to run on
# 14). Then it runs that bundle's tmux, roer and app with a session on the
# oldest macOS GitHub has. What it cannot catch is a call to an API newer
# than 14 that only fails there. Apple silicon only.

on:
  # A new tmux or a new build target, the likeliest ways to raise the floor.
  push:
    paths:
      - .github/macos/**
      - .github/workflows/macos-14.yml
      - src-tauri/tauri.conf.json
      - src-tauri/tauri.macos-cli.conf.json
  # And everything else that could, such as a crate, Tauri or the toolchain,
  # within a day of the commit that did it.
  schedule:
    # 03:47 UTC: off the top of the hour, and clear of nightly-bundles.yml.
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle
    # As release.yml's bundle-macos, so what runs below is what users get.
    uses: ./.github/workflows/tauri-bundle.yml
    with:
      runner: macos-26
      rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
      prepare_script: .github/macos/prepare-bundle.sh
      tauri_args: --target universal-apple-darwin --bundles app --config src-tauri/tauri.macos-cli.conf.json
      bundle_dir: src-tauri/target/universal-apple-darwin/release/bundle
      artifact_name: macos-14-bundle
      cache_key: macos-universal
      artifact_paths: Roer.app.tar.gz
      retention_days: 3

  run:
    name: Floor, and run on the oldest macOS
    needs: bundle
    # The oldest macOS GitHub runs; 14 was retired on 2026-11-02.
    runs-on: macos-15
    timeout-minutes: 15
    env:
      APP: ${{ github.workspace }}/Roer.app
    steps:
      - name: The runner
        run: sw_vers

      # Only for fetch-tmux.sh's TMUX_MAX_MINOS.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/macos
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-14-bundle

      - name: Unpack the app bundle
        run: tar -xzf Roer.app.tar.gz

      - name: The bundle is for macOS 14
        run: |
          set -euo pipefail
          FLOOR=14.0
          TMUX_MAX_MINOS=$(sed -n 's/^TMUX_MAX_MINOS=//p' .github/macos/fetch-tmux.sh)
          # Whether $1 is $2 or older, as macOS versions compare.
          within() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$2" ]; }
          failed=0
          plist=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")
          echo "LSMinimumSystemVersion: $plist"
          within "$plist" "$FLOOR" || { echo "::error::Finder would refuse Roer on macOS $FLOOR: LSMinimumSystemVersion is $plist"; failed=1; }
          for bin in roer-app roer tmux; do
            limit=$FLOOR
            [ "$bin" = tmux ] && limit=$TMUX_MAX_MINOS
            for arch in arm64 x86_64; do
              minos=$(otool -arch "$arch" -l "$APP/Contents/MacOS/$bin" | awk '/LC_BUILD_VERSION/ { found = 1 } found && $1 == "minos" { print $2; exit }')
              echo "$bin $arch: macOS $minos"
              within "$minos" "$limit" || { echo "::error::$bin ($arch) is built for macOS $minos, newer than $limit"; failed=1; }
            done
          done
          exit "$failed"

      - name: tmux runs sessions
        run: |
          set -euo pipefail
          t() { "$APP/Contents/MacOS/tmux" -L probe-tmux -f "$APP/Contents/Resources/roer-tmux.conf" "$@"; }
          t new-session -d -s probe -x 120 -y 40
          t split-window -t probe
          # Single quotes on purpose: the pane's shell works out the sum, so
          # finding 42 means it ran the line, not that the line was echoed.
          # shellcheck disable=SC2016
          t send-keys -t probe 'echo "probe $((6 * 7))"' Enter
          sleep 2
          t capture-pane -p -t probe | tee pane.txt
          grep -q 'probe 42' pane.txt
          t list-panes -t probe
          t kill-server

      - name: The app shows a session
        run: |
          set -euo pipefail
          # A home of its own, so the app links roer and registers MCP there.
          export HOME="$RUNNER_TEMP/home" ROER_SOCKET=probe-app
          handoffs="$HOME/.roer/handoffs"
          mkdir -p "$handoffs"
          # A shell session, put on stage as `roer handoff` would. Written
          # before the app starts, which picks up a waiting record once its
          # window is ready to show it.
          printf '{"args":["new","--shell"],"cwd":"%s","label":"probe"}' "$PWD" > "$handoffs/probe.json.partial"
          mv "$handoffs/probe.json.partial" "$handoffs/probe.json"
          "$APP/Contents/MacOS/roer-app" > app.log 2>&1 &
          pid=$!

          # The window acks the record, deleting it, once the session is
          # attached on screen; a record it could not show becomes .failed.
          for _ in $(seq 120); do
            [ -n "$(find "$handoffs" -name 'probe.json*' -print -quit)" ] || break
            kill -0 "$pid" || { echo "the app exited"; cat app.log; exit 1; }
            sleep 1
          done
          ls -la "$handoffs"
          [ -z "$(find "$handoffs" -name 'probe.json*' -print -quit)" ] || {
            echo "the app did not show the session"
            cat app.log
            exit 1
          }
          mkdir -p shots
          screencapture -x shots/roer.png || true
          "$APP/Contents/MacOS/roer" list | tee sessions.txt
          [ -s sessions.txt ] || { echo "no session behind the one on screen"; exit 1; }
          kill -0 "$pid" || { echo "the app exited"; cat app.log; exit 1; }
          cat "$HOME/Library/Logs/Roer/roer.log" || true

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-14
          path: |
            shots/
            app.log
            ${{ runner.temp }}/home/Library/Logs/Roer/
          if-no-files-found: ignore
