name: Pages

# Builds site/ into _site/ and deploys it to GitHub Pages. Pages visibility
# (private to the org) is a repository setting, not something set here.
#
# Rebuilt on a release being published too, so the download buttons and the
# changelog follow it. A release published by a person fires `published`;
# one published by this repo's own GITHUB_TOKEN would not, which is why the
# workflow also runs on demand.
#
# A release run cannot deploy itself: its ref is the tag, and the
# github-pages environment only lets `main` deploy ("Tag v0.4.2 is not
# allowed to deploy"). So it only dispatches this workflow again on main,
# which can. A workflow_dispatch is one of the few events GITHUB_TOKEN is
# allowed to start a run with.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "src-tauri/icons/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  redeploy-from-main:
    name: Redeploy from main
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout, so gh has no remote to infer the repository from.
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - run: gh workflow run pages.yml --ref "$DEFAULT_BRANCH"

  build:
    name: Build
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A release event checks out its tag by default, which may predate
          # site/ or carry an older copy of it; the site is always main's.
          ref: ${{ github.event.repository.default_branch }}
          # The changelog walks commits between release tags.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: node site/build.mjs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
