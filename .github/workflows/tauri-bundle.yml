name: Tauri Bundle

# One call = one platform's bundle, uploaded as an artifact. This workflow never
# creates a release: `release.yml` owns that, packaging the .dmg on its own
# runner from every platform's artifacts.
#
# Adding a platform is a new caller in release.yml, not a change here. macOS,
# Linux and Windows call it today.

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      rust_targets:
        required: true
        type: string
      tauri_args:
        required: false
        type: string
        default: ""
      bundle_dir:
        description: Directory tauri writes bundles into, relative to the repo root.
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      cache_key:
        required: false
        type: string
        default: ""
      artifact_paths:
        required: true
        type: string
      prepare_script:
        description: A script to run from the repo root before building, e.g. to stage resources the tauri config ships.
        required: false
        type: string
        default: ""
      retention_days:
        required: false
        type: number
        default: 7
      release_environment:
        # Unused today: roer's bundle job consumes no secrets. Kept for a
        # future leg that does (a Windows build needs its cert before the MSI
        # is even assembled), because adding it later means touching every
        # caller.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ inputs.artifact_name }}
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.release_environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What Tauri links against on Linux, as in CI's Checks, plus `file`,
      # which the AppImage tooling shells out to. macOS and Windows have it all
      # in the system.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev file

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ inputs.rust_targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # roer has no Cargo.toml at the repo root, so the action's default
          # `. -> target` finds no workspace and silently caches nothing.
          workspaces: src-tauri -> target
          key: ${{ inputs.cache_key || inputs.artifact_name }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prepare
        if: inputs.prepare_script != ''
        shell: bash
        env:
          PREPARE_SCRIPT: ${{ inputs.prepare_script }}
        run: bash "$PREPARE_SCRIPT"

      # No tagName/releaseName, so tauri-action builds and creates nothing.
      # beforeBuildCommand (npm run build) produces dist/, which
      # tauri::generate_context!() embeds at compile time.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          args: ${{ inputs.tauri_args }} --verbose
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      # A gzipped tar of the .app is what the CodeSign service takes, should
      # signing come back. Tar also preserves the bundle's symlinks and mode bits, which a
      # zip round-trip through upload-artifact would not.
      - name: Tar the .app for signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          BUNDLE_DIR: ${{ inputs.bundle_dir }}
        run: |
          set -euo pipefail
          tar -czf Roer.app.tar.gz -C "$BUNDLE_DIR/macos" Roer.app
          ls -lh Roer.app.tar.gz

      - name: Stage selected bundles
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ inputs.artifact_paths }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p bundle-artifacts

          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            # Unquoted on purpose: the input is a list of glob patterns and
            # this is where they expand, which is what `nullglob` above is for.
            # shellcheck disable=SC2206
            matches=( $pattern )
            if [ "${#matches[@]}" -gt 0 ]; then
              cp "${matches[@]}" bundle-artifacts/
            fi
          done <<< "$ARTIFACT_PATHS"

          if [ -z "$(find bundle-artifacts -maxdepth 1 -type f -print -quit)" ]; then
            echo "No bundle artifacts matched:"
            printf '%s\n' "$ARTIFACT_PATHS"
            exit 1
          fi
          ls -la bundle-artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: bundle-artifacts/*
          # Already-compressed payload, and re-zipping a signed bundle is how
          # signatures get mangled.
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
