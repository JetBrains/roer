[package]
name = "roer"
version = "0.5.0"
description = "Session host for agent terminals"
edition = "2021"
rust-version = "1.77.2"
default-run = "roer"

[lib]
name = "roer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.7", features = ["ws"] }
base64 = "0.23.1"
dunce = "1.0.5"
mime_guess = "2.0.5"
notify = "8.2.0"
portable-pty = "0.9.0"
rand = "0.8"
rust-embed = "8.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.4.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[[bin]]
name = "roer-server"
path = "src/bin/server.rs"
